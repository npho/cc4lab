[project]
name = "cc4lab"
version = "0.1.0"
description = "Counterfactual responsibility attribution among CAGE Challenge 4 blue agents, built on jaxborg."
readme = "README.md"
requires-python = "==3.11.*"  # matches ../jaxborg/.python-version
dependencies = [
    "jaxborg",
    "numpy",
]

# Backend selection mirrors jaxborg's extras. Pick exactly one:
#   uv sync --extra cpu    (macOS dev, CI)
#   uv sync --extra cuda   (unagi / NVIDIA Linux)
[project.optional-dependencies]
cpu = ["jaxborg[cpu]"]
cuda = [
    "jaxborg[cuda]",
    # jaxborg's `jax>=0.7.1` override (repeated below) also strips the
    # `[cuda12]` extra from `jax[cuda12]`, so jaxborg[cuda] alone installs
    # CPU-only JAX. Require the CUDA plugin directly; keep in step with jax.
    "jax-cuda12-plugin[with-cuda]==0.10.0 ; sys_platform == 'linux'",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cc4lab"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]
# uv applies overrides/constraints only from the root project, and a path
# dependency contributes its loose specifiers but not its lockfile. Without
# the blocks below, cc4lab resolves different versions than jaxborg tested
# (seen: jaxmarl main broke FsmRedCC4Env.reset; mujoco-mjx 4 broke import).
#
# 1. jaxborg's own [tool.uv] overrides, repeated verbatim (hand-maintained).
# 2. Generated from ../jaxborg/uv.lock: git URLs as overrides, every other
#    package pinned via constraints. Regenerate after bumping jaxborg with
#    `uv run python scripts/pin_jaxborg_lock.py && uv lock`.
override-dependencies = [
    "matplotlib>=3.9",
    "jax>=0.7.1",
    "jaxlib>=0.7.1",
    "numpy>=2.1,<2.4",
    "scipy>=1.14",
    "torch>=2.4",
    # BEGIN jaxborg-lock (generated by scripts/pin_jaxborg_lock.py)
    "cyborg @ git+https://github.com/PaulHax/cage-challenge-4.git@69ded9aa40b16ce87f7106fe961f68ad08d47176",
    "jaxmarl @ git+https://github.com/FLAIROx/JaxMARL.git@63226c5fbe5385d67d4b3b97511495a0f2c75bb9",
    # END jaxborg-lock
]
